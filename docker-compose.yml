services:
  broker:
    build:
      context: .
      args:
        BINARY: server
    command: ["-p", "/data", "-c", "/etc/musil/server.toml"]
    ports:
      - "9092:9092"
    volumes:
      - broker-data:/data
      - ./compose/standalone.toml:/etc/musil/server.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - musil

  seeder:
    build:
      context: .
      args:
        BINARY: seeder
    command: ["-b", "broker:9092", "-f", "/etc/musil/seeder.toml"]
    volumes:
      - ./seeder.toml:/etc/musil/seeder.toml:ro
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - musil

  producer:
    build:
      context: .
      args:
        BINARY: producer
    command: ["-b", "broker:9092", "-t", "first_topic", "-v", "integration-test-message"]
    depends_on:
      seeder:
        condition: service_completed_successfully
    networks:
      - musil

  consumer:
    build:
      context: .
      args:
        BINARY: consumer
    command: ["-b", "broker:9092", "-t", "first_topic", "-o", "0"]
    depends_on:
      producer:
        condition: service_completed_successfully
    networks:
      - musil

volumes:
  broker-data:

networks:
  musil:
