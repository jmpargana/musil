[package]
name = "rafka"
version = "0.1.0"
edition = "2024"
publish = ["artifactory"]

[dependencies]
arc-swap = "1.9.2"
byteorder = "1.5.0"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6.2.1"
derive_builder = "0.20.2"
memmap = "0.7.0"
murmur2 = "0.1.0"
rand = "0.10.2"
serde = "1.0.228"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tempdir = "0.3.7"
