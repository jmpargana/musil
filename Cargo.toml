[package]
name = "musil"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jmpargana/musil"

[workspace.dependencies]
arc-swap = "1.9.2"
byteorder = "1.5.0"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
derive_builder = "0.20.2"
memmap = "0.7.0"
murmur2 = "0.1.0"
rand = "0.10.2"
config = "0.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
broker = { package = "musil-broker", path = "crates/broker" }
network = { package = "musil-network", path = "crates/network", version = "0.1.0" }
proto = { package = "musil-proto", path = "crates/proto", version = "0.1.0" }
storage = { package = "musil-storage", path = "crates/storage", version = "0.1.0" }
crc-fast = "1.10.0"
tokio-stream = "0.1.19"
async-trait = "0.1.92"
raft = { package = "musil-raft", path = "crates/raft", version = "0.1.0" }

[dependencies]
broker = { package = "musil-broker", path = "crates/broker" }
network = { package = "musil-network", path = "crates/network" }
storage = { package = "musil-storage", path = "crates/storage" }
producer = { package = "musil-producer", path = "crates/producer" }
consumer = { package = "musil-consumer", path = "crates/consumer" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
config = "0.14"
murmur2 = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
tracing-log = "0.2.0"
crc-fast = "1.10.0"
flate2 = "1.1.9"
tokio-stream = "0.1.19"
async-trait = "0.1.92"

[dev-dependencies]
tempdir = "0.3.7"
