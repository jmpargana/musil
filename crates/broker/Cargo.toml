[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
storage = { path = "../storage" }
arc-swap = "1"
bytes = "1"
derive_builder = "0.20"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempdir = "0.3"
