[package]
name = "musil-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Network layer for musil message broker"

[dependencies]
proto = { package = "musil-proto", path = "../proto", version = "0.1.0" }
bytes = "1"
derive_builder = "0.20"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempdir = "0.3"
