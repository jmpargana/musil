[advisories]
ignore = [
    "RUSTSEC-2020-0077", # memmap is unmaintained (migrate to memmap2)
    "RUSTSEC-2023-0018", # tempdir vulnerability (migrate to tempfile)
    "RUSTSEC-2018-0017", # tempdir is deprecated (migrate to tempfile)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index", "https://index.crates.io"]
allow-git = []
