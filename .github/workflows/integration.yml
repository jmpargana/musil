name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start broker
        run: |
          docker compose up -d broker
          docker compose up --wait broker

      - name: Run seeder
        run: docker compose up seeder

      - name: Run producer
        run: docker compose up producer

      - name: Verify consumer output
        run: |
          docker compose up consumer
          docker compose logs consumer | grep -q "first_topic"

      - name: Teardown
        if: always()
        run: docker compose down -v
