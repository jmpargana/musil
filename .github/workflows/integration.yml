name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Verify unified CLI image builds
        run: docker build --build-arg BINARY=musil -t musil-cli-test .

      - name: Start broker
        run: |
          docker compose up -d broker
          docker compose up --wait broker

      - name: Run seeder
        run: docker compose up seeder

      - name: Produce and verify
        run: |
          docker compose up producer
          docker compose logs producer | grep -q "Publishing record"

      - name: Teardown
        if: always()
        run: docker compose down -v
