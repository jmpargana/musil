name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build images
        run: |
          docker compose build

      - name: Start cluster
        run: |
          docker compose up -d broker-1 broker-2 broker-3
          echo "Waiting for brokers to become healthy..."
          docker compose up -d --wait

      - name: Run seeder
        run: docker compose up seeder

      - name: Run integration tests
        run: cargo llvm-cov --test integration --lcov --output-path integration-lcov.info
        env:
          RAFKA_BOOTSTRAP_SERVERS: "localhost:9092,localhost:9093,localhost:9094"

      - name: Upload integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: integration-lcov.info
          flags: integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Teardown
        if: always()
        run: docker compose down -v
